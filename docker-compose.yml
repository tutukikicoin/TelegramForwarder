services:
  telegram-forwarder:
    build:
      context: .
    image: tgforwarder-local:latest
    container_name: telegram-forwarder
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - feishu-bridge
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.path.exists(\"/app/sessions/user.session\")' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./db:/app/db
      - ./.env:/app/.env
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./temp:/app/temp
      - ./ufb/config:/app/ufb/config
      - ./config:/app/config
      - ./rss/data:/app/rss/data
      - ./rss/media:/app/rss/media
      - ./main.py:/app/main.py
      - ./rss/main.py:/app/rss/main.py
      - ./rss/app/routes/web.py:/app/rss/app/routes/web.py
      - ./rss/app/routes/auth.py:/app/rss/app/routes/auth.py
      - ./rss/app/templates/web_dashboard.html:/app/rss/app/templates/web_dashboard.html
    environment:
      - FEISHU_APP_ID=cli_a95902db34b8dbc9
      - FEISHU_APP_SECRET=0u7wB9AimKclxwmk7bY25g5BCLFwUFyc
      - TG_PROXY=socks5://host.docker.internal:10808
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    stdin_open: true
    tty: true

  feishu-bridge:
    image: python:3.11-slim
    container_name: feishu-bridge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    command: python /app/feishu_bridge.py
    volumes:
      - ./feishu_bridge.py:/app/feishu_bridge.py
      - ./db:/app/db
    environment:
      - FEISHU_APP_ID=cli_a95902db34b8dbc9
      - FEISHU_APP_SECRET=0u7wB9AimKclxwmk7bY25g5BCLFwUFyc
      - FEISHU_CHAT_IDS=https://open.feishu.cn/open-apis/bot/v2/hook/6d525b1c-3469-4903-8f48-94f58dd13dc6
      - FEISHU_WEBHOOK_SECRET=PO5iHQxjqD41w56SozYbtd
      - "FEISHU_ROUTES=每日大金狗=oc_2330f59de3ded6baac8b0b77be7b118a|扫链信号=oc_2330f59de3ded6baac8b0b77be7b118a"
      - BRIDGE_PORT=8001
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
